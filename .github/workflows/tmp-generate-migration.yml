# TEMPORARY: generates the EF Core migration on CI because the authoring environment has no .NET SDK.
# Removed from the branch before the pull request is merged.
name: tmp-generate-ef-migration

on:
  push:
    branches: [feat/ai-analysis]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Build whole solution (compile check, including tests)
        run: dotnet build PostulaAI.slnx -c Debug
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.14
      - name: Generate InitialCreate if missing, otherwise check for pending model changes
        env:
          ConnectionStrings__Postgres: Host=localhost;Database=design_time_only
        run: |
          if ls src/PostulaAI.Api/Shared/Persistence/Migrations/*_AddAnalyses.cs >/dev/null 2>&1; then
            dotnet ef migrations has-pending-model-changes --project src/PostulaAI.Api --no-build
          else
            dotnet ef migrations add AddAnalyses --project src/PostulaAI.Api --output-dir Shared/Persistence/Migrations --no-build
          fi
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/PostulaAI.Api/Shared/Persistence/Migrations
          if ! git diff --cached --quiet; then
            git commit -m "feat: add analyses migration (generated by dotnet ef)"
            git push
          fi
